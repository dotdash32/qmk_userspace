combos:
  # parens / brackets / minus (vertical neighbors)
  - { tk: [U, J], k: {t: '(', s: '['}, l: [Base] }
  - { tk: [I, K], k: {t: ')', s: ']'}, l: [Base] }
  - { tk: [O, L], k: '-', l: [Base] }
  - { tk: [J, M], k: '[', l: [Base] }
  - { tk: [K, ','], k: ']', l: [Base] }
  - { tk: [F, V], k: ']', l: [Base, Nav] }
  - { tk: [D, C], k: '[', l: [Base, Nav] }
  - { tk: ['-', '7'], k: '[', l: [Num] }
  - { tk: ['=', '8'], k: ']', l: [Num] }
  # layer toggle (D+K on Base, 3+8 on Num)
  - { tk: [D, K], k: TG Num, l: [Base] }
  - { tk: ['3', '8'], k: TG Num, l: [Num] }
  # left-hand / punctuation
  - { tk: [W, {t: S, h: RCTL}], k: TAB, l: [Base] }
  - { tk: ['.', '/'], k: ENT, l: [Base] }
  - { tk: [',', '.'], k: TAB, l: [Base, Fn] }
  - { tk: [Z, X], k: "Ctl+`", l: [Base, Nav] }
  # 4-key boot / 3-key one-shot Sys (offset so they don't overlap)
  - { tk: [Q, W, E, T], k: BOOT, l: [Base], a: top, draw_separate: true}
  - { tk: [Y, I, O, P], k: BOOT, l: [Base], a: top, draw_separate: true}
  - { tk: [Q, E, T], k: OSL Sys, l: [Base], a: top, o: 0.6, draw_separate: true }
  - { tk: [Y, I, P], k: OSL Sys, l: [Base], a: top, o: 0.6, draw_separate: true }
  # other vertical neighbors
  - { tk: [T, G], k: WBAK, l: [Base] }
  - { tk: [P, "'"], k: ';', l: [Base] }
  - { tk: [E, D], k: '=', l: [Base] }
  - { tk: [R, F], k: {t: ':', s: ';'}, l: [Base] }


draw_config:
  key_w: 60.0
  key_h: 56.0
  split_gap: 30.0
  combo_w: 28.0
  combo_h: 26.0
  key_rx: 6.0
